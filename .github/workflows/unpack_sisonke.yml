name: Build Sisonke Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current GitHub source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter project
        run: |
          test -f pubspec.yaml
          test -d lib
          echo "Building directly from current GitHub source."
          echo "Legacy ZIP extraction is disabled."

      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sisonke-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error 
