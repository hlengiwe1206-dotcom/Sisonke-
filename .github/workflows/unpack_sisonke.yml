name: Unpack Sisonke Flutter Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Sisonke project
        run: |
          unzip -o Sisonke_GitHub_Ready_CORRECTED.zip -d extracted_project
          shopt -s dotglob
          mv extracted_project/* .
          rm -rf extracted_project

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit extracted Flutter project
        run: |
          git add .
          git commit -m "Extract Sisonke Live MVP v4 Flutter project" || echo "No changes to commit"
          git push
