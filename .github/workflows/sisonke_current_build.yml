name: SISONKE - CURRENT SOURCE APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: CURRENT SISONKE BUILD
    runs-on: ubuntu-latest

    steps:

      - name: Checkout current main source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Verify current source
        run: |
          echo "======================================"
          echo "SISONKE CURRENT SOURCE"
          echo "======================================"

          test -f pubspec.yaml
          test -d lib

          echo ""
          echo "Checking Help Exchange..."

          grep -R "'type': 'help_needed'" lib/data lib/screens

          if grep -R "'type': 'help_request'" lib/data lib/screens; then
            echo "ERROR: OLD help_request VALUE FOUND"
            exit 1
          fi

          echo ""
          echo "OK: Help Exchange source verified."

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate Android platform
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Analyze Sisonke application
        run: |
          flutter analyze lib \
            --no-fatal-warnings \
            --no-fatal-infos

      - name: Build current debug APK
        run: |
          flutter build apk --debug

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload CURRENT Sisonke APK
        uses: actions/upload-artifact@v4
        with:
          name: Sisonke-CURRENT-SOURCE-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
